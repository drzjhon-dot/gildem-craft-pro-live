[build]
 command = "npm run build"
 publish = "dist"
 functions = "netlify/functions"
[functions]
 node_bundler = "esbuild"
[build.environment]
 NODE_VERSION = "22"
[[headers]]
 for = "/app.js"
 [headers.values]
 Cache-Control = "no-cache"
[[headers]]
 for = "/src/*"
 [headers.values]
 Cache-Control = "no-cache"
[[headers]]
 for = "/index.html"
 [headers.values]
 Cache-Control = "no-cache"
[[headers]]
 for = "/.netlify/functions/*"
 [headers.values]
 Cache-Control = "no-store"
