/* Craft planner v2: three short steps; technical settings hidden until requested. */
.craft-wizard{padding:25px 27px}.craft-step{display:flex;gap:12px;align-items:flex-start;margin:5px 0 15px;padding-top:6px}.craft-step:not(:first-child){border-top:1px solid #304154;padding-top:21px;margin-top:23px}.craft-step-num{display:inline-grid;place-items:center;flex:none;width:31px;height:31px;border:1px solid #aa8249;border-radius:10px;background:#493a28;color:#ffe0a1;font-weight:850;font-size:13px}.craft-step h3{font-size:16px;line-height:1.3;margin:1px 0 3px}.craft-step p{font-size:12px;color:#9fb0c2;line-height:1.5;margin:0}.craft-step-fields{margin:0 0 8px}.craft-wizard .field label{font-size:12px}.craft-wizard .field select,.craft-wizard .field input{min-height:46px;font-size:13px;border-color:#435569;background:#0c1b2d}.craft-return-hint{display:flex;flex-direction:column;gap:6px;background:#193d38;border:1px solid #2d7763;border-radius:12px;padding:14px 17px;margin:14px 0 4px}.craft-return-hint strong{font-size:17px;color:#96f0cd}.craft-return-hint span{font-size:11px;color:#bdd7cd;line-height:1.6}.craft-simple-notes{display:flex;flex-direction:column;gap:7px;font-size:11px;color:#aabed1;line-height:1.6;margin:13px 0 4px}.craft-simple-notes span:before{content:'✓';color:#91d7ac;margin-right:8px}.craft-advanced{border:1px solid #33475c;border-radius:12px;background:#0e1f31;padding:0 15px;margin-top:24px}.craft-advanced summary{padding:15px 3px;color:#bac9d9;font-size:12px;font-weight:700;cursor:pointer;list-style:none}.craft-advanced summary::-webkit-details-marker{display:none}.craft-advanced summary:after{content:'⌄';float:right;font-size:17px}.craft-advanced[open] summary:after{content:'⌃'}.craft-advanced[open]{padding-bottom:19px}.craft-checkbox{min-height:45px;padding:8px 10px;border:1px solid #33475c;border-radius:8px}.craft-submit{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:22px}.craft-main-submit{min-height:51px;padding:14px 23px;font-size:13px;letter-spacing:.35px;box-shadow:0 8px 25px #dbad4e20}.craft-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border:1px solid #4b684e;padding:20px 24px;border-radius:14px;background:linear-gradient(110deg,#1c3534,#182a35)}.craft-summary .kicker{font-size:10px;letter-spacing:1.6px;font-weight:800;color:#9fddad}.craft-summary h3{font-size:17px;margin:7px 0}.craft-summary p{font-size:11px;line-height:1.55;color:#abc0c7;margin:0}

/* v4 + v6 merged: same three-step wizard, dedicated crafting workspace */
.qty-input{width:85px;max-width:100%;padding:9px 10px;border:1px solid #54718c;border-radius:9px;background:#0b1b2c;color:#f6eedc;font:700 13px inherit;text-align:center;box-shadow:inset 0 1px 3px #0003}
.qty-input:focus{outline:2px solid #d0ad70;outline-offset:1px}
.craft-candidates{margin:0;padding:16px 20px}
.craft-candidates summary{cursor:pointer;color:#e8d2a2;font-size:13px;font-weight:800}
.craft-candidates .candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:9px;margin-top:15px}
.candidate-item{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;border:1px solid #34495e;background:#101e2e;min-width:0}
.candidate-item img{width:36px;height:36px;object-fit:contain}
.candidate-item div{min-width:0;flex:1}
.candidate-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.candidate-item small{display:block;color:#aebed2;line-height:1.5;font-size:10px}
.candidate-item button{flex-shrink:0}
@media(max-width:740px){.qty-input{width:77px}.craft-candidates .candidate-grid{grid-template-columns:1fr}}

/* v7: selector de crafting por familias. Botones reales, teclado y búsqueda. */
.branch-picker{grid-column:1 / -1!important;min-width:0}
.branch-picker>label{font-size:12px!important;color:#d4e0eb;display:block;margin-bottom:12px}
.branch-group-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-bottom:14px}
.branch-group{min-width:0;min-height:105px;cursor:pointer;text-align:left;border:1px solid #3b4f62;border-radius:12px;padding:12px 10px;background:#102338;color:#cedbea;display:flex;align-items:flex-start;gap:10px;transition:background .15s,border-color .15s,transform .15s}
.branch-group:hover{background:#19314a;border-color:#8bacc1;transform:translateY(-1px)}
.branch-group.active{background:linear-gradient(145deg,#3a3122,#242d35);border-color:#d5aa63;box-shadow:inset 0 0 0 1px #b68d4b50}
.branch-group-icon{font-size:23px;color:#e6c286;line-height:1.1}
.branch-group-copy{min-width:0}
.branch-group .item-icon,.branch-choice .item-icon,.branch-choice-footer .item-icon{flex:0 0 auto}
.branch-group strong{font-size:12px;line-height:1.4;color:#f1f1ee;display:block}
.branch-group small{font-size:10px;color:#8fa8be;line-height:1.35}
.branch-group.active small{color:#d2baa1}
.branch-group:focus-visible,.branch-choice:focus-visible{outline:3px solid #f3c875;outline-offset:2px}
.branch-filter{position:relative;margin:8px 0 12px}
.branch-filter input{padding-right:35px!important;min-height:45px;width:100%;border:1px solid #4d6076;border-radius:9px;background:#0b1b2c;color:#eaf1fa;font-size:13px}
.branch-filter>span{position:absolute;right:13px;top:12px;color:#a8bdd0;font-size:20px;pointer-events:none}
.branch-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:228px;overflow:auto;padding:4px 2px 8px}
